<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opencode: God-Tier Polish</title>
    <style>
        :root {
            --bg: #050509;
            --text: #E2E8F0;
            --tick: #3B82F6;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, sans-serif;
            margin: 0; height: 100vh;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* --- 1. TUNNEL VISION (心流容器) --- */
        .viewport {
            flex: 1;
            overflow-y: scroll;
            padding: 100px 20px;
            perspective: 1000px; /* 开启 3D 透视 */
            
            /* 平滑过渡 */
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 当进入专注模式时 */
        body.focus-mode .viewport {
            transform: scale(0.98);
            filter: blur(4px) brightness(0.6);
            opacity: 0.8;
        }

        /* --- CONTENT LIST --- */
        .item {
            display: flex; align-items: center; gap: 20px;
            margin-bottom: 30px;
            max-width: 600px; margin-left: auto; margin-right: auto;
        }

        /* --- 2. VELOCITY STRETCH (相对论铆钉) --- */
        .tick-wrapper {
            width: 20px; display: flex; justify-content: center;
        }
        
        .tick {
            width: 10px; height: 10px;
            background: var(--tick);
            border-radius: 100px; /* 始终保持圆角 */
            
            /* 关键：拉伸基准点 */
            transform-origin: center;
            will-change: transform;
        }

        .text-block {
            background: rgba(255,255,255,0.05);
            padding: 15px; border-radius: 8px; flex: 1;
            font-size: 0.9rem; color: #888;
        }

        /* --- INPUT DESK --- */
        .desk {
            height: 90px;
            background: rgba(20,20,25,0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: center; align-items: center;
            z-index: 100;
            transition: all 0.3s;
        }

        /* 专注模式下，输入台更亮、更大 */
        body.focus-mode .desk {
            background: rgba(30,30,40,1);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
            transform: scale(1.01);
        }

        .input-field {
            width: 500px; padding: 12px;
            background: transparent; border: none; border-bottom: 1px solid #444;
            color: white; font-size: 1.1rem; outline: none;
            transition: border-color 0.3s;
        }
        .input-field:focus { border-color: var(--tick); }

    </style>
</head>
<body>

    <div class="viewport" id="scrollContainer">
        <!-- JS 将生成 50 个列表项 -->
        <div id="content"></div>
    </div>

    <div class="desk">
        <input type="text" class="input-field" id="mainInput" placeholder="Click here to enter Focus Mode...">
    </div>

    <script>
        const container = document.getElementById('scrollContainer');
        const content = document.getElementById('content');
        const input = document.getElementById('mainInput');
        const ticks = [];

        // 1. 生成内容
        for (let i = 0; i < 50; i++) {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `
                <div class="tick-wrapper"><div class="tick"></div></div>
                <div class="text-block">History Log Entry #${i + 1} - System Analysis</div>
            `;
            content.appendChild(div);
            ticks.push(div.querySelector('.tick'));
        }

        // --- INTERACTION 1: TUNNEL VISION ---
        input.addEventListener('focus', () => document.body.classList.add('focus-mode'));
        input.addEventListener('blur', () => document.body.classList.remove('focus-mode'));


        // --- INTERACTION 2: VELOCITY STRETCH ---
        let lastScrollY = container.scrollTop;
        let isScrolling = false;

        function updateVelocity() {
            const currentScrollY = container.scrollTop;
            const velocity = currentScrollY - lastScrollY;
            lastScrollY = currentScrollY;

            // 计算拉伸比例 (限制最大拉伸为 3 倍，避免太夸张)
            // Math.abs(velocity) 越大，stretch 越大
            const stretch = Math.min(Math.abs(velocity) * 0.15, 3);
            const scaleY = 1 + stretch;
            
            // 保持体积守恒：拉长的时候变细 (ScaleX 变小)
            const scaleX = 1 / Math.sqrt(scaleY); // 简单的体积守恒模拟

            // 应用变形
            ticks.forEach(tick => {
                // 只有在视口内的才变形 (优化性能)
                // 这里为了演示简单全量应用，实际开发可以用 IntersectionObserver
                tick.style.transform = `scale(${scaleX}, ${scaleY})`;
            });

            // 摩擦力衰减 (让变形逐渐恢复)
            if (Math.abs(velocity) > 0.1) {
                requestAnimationFrame(updateVelocity);
            } else {
                // 停止时复原
                ticks.forEach(tick => tick.style.transform = `scale(1, 1)`);
            }
        }

        container.addEventListener('scroll', () => {
            // 触发更新循环
            requestAnimationFrame(updateVelocity);
        });

    </script>
</body>
</html>
